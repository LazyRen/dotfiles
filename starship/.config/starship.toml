"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_state\
$git_status\
$git_metrics\
$jobs\
$python\
$kubernetes\
$fill\
$status\
$cmd_duration\
$username\
$hostname\
$time\
$line_break\
$character"""

[fill]
symbol = " "

[directory]
truncation_length = 10
truncate_to_repo = false
truncation_symbol = ".../"
style = "blue bold"
read_only = " "
fish_style_pwd_dir_length = 0
home_symbol = "~"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style) "
style = "green"
truncation_length = 32
truncation_symbol = "…"

[git_status]
format = "[$all_status$ahead_behind]($style)"
style = ""
conflicted = "[~$count](red) "
stashed = "[*$count](green) "
staged = "[+$count](yellow) "
modified = "[!$count](yellow) "
untracked = "[?$count](cyan) "
ahead = "[⇡$count](green)"
behind = "[⇣$count](green)"
diverged = "[⇣${behind_count}⇡${ahead_count}](green)"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "yellow"
rebase = "REBASING"
merge = "MERGING"
revert = "REVERTING"
cherry_pick = "CHERRY-PICKING"
bisect = "BISECTING"
am = "AM"
am_or_rebase = "AM/REBASE"

[git_metrics]
disabled = false
format = "([+$added](green) )([-$deleted](red) )"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"
min_time = 2_000

[jobs]
format = "[$symbol$number]($style) "
style = "blue bold"
symbol = "✦"
number_threshold = 1

[hostname]
ssh_only = true
format = "[$hostname]($style) "
style = "yellow"

[username]
show_always = false
format = "[$user@]($style)"
style_user = "bright-black"
style_root = "red bold"

[time]
disabled = false
format = "[$time]($style)"
style = "bright-black"
time_format = "%H:%M:%S"

[status]
disabled = false
format = "[$symbol$signal_name$common_meaning]($style) "
symbol = " "
style = "red bold"
not_executable_symbol = " "
not_found_symbol = " "
sigint_symbol = " "
signal_symbol = " "
map_symbol = true
recognize_signal_code = true

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
detect_extensions = []
detect_files = []

[kubernetes]
disabled = false
format = "[$symbol$context( \\($namespace\\))]($style) "
symbol = "☸ "
style = "cyan"
